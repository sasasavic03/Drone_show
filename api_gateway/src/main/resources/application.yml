spring:
  profiles:
    active: docker

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: http://auth_service:8080
              predicates:
                - Path=/auth/**

            - id: user-service
              uri: http://user_service:8080
              predicates:
                - Path=/users/**

            - id: package-service
              uri: http://package_service:8080
              predicates:
                - Path=/packages/**

            - id: booking-service
              uri: http://booking_service:8080
              predicates:
                - Path=/bookings/**

            - id: media-service
              uri: http://media_service:8080
              predicates:
                - Path=/media/**

          globalcors:
            cors-configurations:
              '[/**]':
                allowedOriginPatterns: "*"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowedHeaders: "*"
                exposedHeaders: "*"

server:
  port: 8080

jwt:
  secret: your-secret-key-change-this-in-production-with-a-long-random-string-at-least-256-bits

logging:
  level:
    root: INFO
